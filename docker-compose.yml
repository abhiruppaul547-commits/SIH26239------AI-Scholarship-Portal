services:
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - frontend
      - core-backend
      - ai-service

  duckdns-updater:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    command: >
      sh -c '
        while true; do
          echo "Updating DuckDNS IP for sih2639-ps.duckdns.org..."
          curl -s "https://www.duckdns.org/update?domains=sih2639-ps&token=$${DUCKDNS_TOKEN}&ip="
          echo ""
          sleep 300
        done
      '
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - app-network

  core-backend:
    build:
      context: ./core-backend
    restart: unless-stopped
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6J0uYPSIEqbgME8kdBdL9aP42JDUpVN73MsLNaNB8YNVA}
      - GEMINI_MODEL=gemini-3.8-flash
      - FALLBACK_MODEL=gemini-3.5-flash-lite
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
