spring.application.name=core-service
server.port=8080

# Default DataSource: H2 in PostgreSQL compatibility mode for instant zero-config startup
spring.datasource.url=jdbc:h2:mem:scholarshipdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart / File Upload configs
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Microservice & External Integration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Security & JWT Configuration
jwt.secret=sih26239_super_secure_secret_key_for_scholarship_portal_ai_2026_tribal_welfare_32bytes_min!
jwt.expiration-ms=86400000
